name: Pinned public source snapshot
on:
  push:
    branches: [diagnostics/td-source-snapshot-20261014]
    paths: [.github/workflows/source-snapshot-diagnostic.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5aa5dda931b1188115d4a46d9e5da7fee2204b06
          persist-credentials: false
          fetch-depth: 1
      - name: Archive exact tracked public source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5aa5dda931b1188115d4a46d9e5da7fee2204b06
          mkdir -p "$RUNNER_TEMP/td-public-source"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/td-public-source/source.tar.gz"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/td-public-source/source-identity.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/td-public-source/tracked-tree.txt"
          cd "$RUNNER_TEMP/td-public-source"
          sha256sum source.tar.gz source-identity.txt tracked-tree.txt > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: td-public-source-5aa5dda
          path: ${{ runner.temp }}/td-public-source/
          if-no-files-found: error
          retention-days: 1
